spring.application.name=blog-project01

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# MySQL
# Configure these values through environment variables.
# ------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${BLOG_DB_URL:jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${BLOG_DB_USERNAME:root}
spring.datasource.password=${BLOG_DB_PASSWORD:}

# ------------------------------------------------------------
# MyBatis
# ------------------------------------------------------------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.chiaya.pojo
mybatis.configuration.map-underscore-to-camel-case=true

# ------------------------------------------------------------
# Redis
# ------------------------------------------------------------
spring.data.redis.host=${BLOG_REDIS_HOST:localhost}
spring.data.redis.port=${BLOG_REDIS_PORT:6379}
spring.data.redis.database=${BLOG_REDIS_DATABASE:0}

# ------------------------------------------------------------
# Token
# Set BLOG_JWT_SECRET to a long random value in every environment.
# ------------------------------------------------------------
blog.jwt.secret=${BLOG_JWT_SECRET:change-this-placeholder-before-deploying}
blog.jwt.expire-minutes=${BLOG_JWT_EXPIRE_MINUTES:120}

# ------------------------------------------------------------
# Uploads
# ------------------------------------------------------------
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=42MB
blog.upload.dir=${BLOG_UPLOAD_DIR:uploads}

# ------------------------------------------------------------
# Swagger
# ------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.chiaya.controller
